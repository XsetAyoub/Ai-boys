<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON RUSH — Racing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08101b;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;inset:0;pointer-events:none;padding:22px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 5px #000}#brand{font-weight:900;letter-spacing:4px;font-size:24px;color:#5df4ff}#speed{font-size:48px;font-weight:900}#speed small{font-size:13px;letter-spacing:2px}#right{text-align:right;font-weight:bold}#lap{font-size:21px}#boost{margin-top:8px;color:#5df4ff}#msg{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;text-align:center;text-shadow:0 5px 20px #000;color:#fff;pointer-events:none}#start{position:fixed;inset:0;background:linear-gradient(180deg,#06101b99,#02050dcc);display:flex;align-items:center;justify-content:center;text-align:center}#panel{background:#081522dd;border:1px solid #48eaff66;border-radius:18px;padding:32px 40px;max-width:550px;box-shadow:0 0 45px #08d9ff22}h1{font-size:42px;margin:0;color:#59f2ff;letter-spacing:3px}p{line-height:1.5;color:#d0dbe5}button{border:0;border-radius:9px;background:#13c9e8;color:#03121b;font-weight:900;padding:15px 36px;font-size:18px;cursor:pointer;margin-top:10px}#help{font-size:13px;color:#a8bdca}.mobile{position:fixed;bottom:18px;display:none;gap:12px}.mobile button{pointer-events:auto;opacity:.85;padding:18px 22px}.left{left:18px}.right{right:18px}@media(max-width:800px){.mobile{display:flex}#speed{font-size:34px}#panel{margin:15px;padding:22px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div><div id="brand">NEON RUSH</div><div id="speed">0 <small>KM/H</small></div></div><div id="right"><div id="lap">LAP 1 / 3</div><div id="position">POSITION 1 / 4</div><div id="boost">NITRO ▰▰▰</div></div></div>
<div id="msg"></div>
<div id="start"><div id="panel"><h1>NEON RUSH</h1><p>Race the coast. Hit the apex. Use nitro to fly past rivals and finish 3 laps.</p><p><b>W / ↑</b> accelerate &nbsp; <b>S / ↓</b> brake &nbsp; <b>A D / ← →</b> steer<br><b>SHIFT</b> nitro &nbsp; <b>SPACE</b> drift/brake</p><button id="go">START RACE</button><div id="help">PC keyboard supported • No downloads • Free to play</div></div></div>
<div class="mobile left"><button id="ml">◀</button><button id="mr">▶</button></div><div class="mobile right"><button id="mg">GAS</button><button id="mn">NITRO</button></div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bind(id,k){let b=document.getElementById(id);b.onpointerdown=()=>keys[k]=true;b.onpointerup=b.onpointerleave=()=>keys[k]=false}bind('ml','a');bind('mr','d');bind('mg','w');bind('mn','shift');
let running=false,started=false,player={x:0,speed:0,nitro:100,lap:1,progress:0,steer:0},rivals=[{x:-.45,s:0,p:0,color:'#ff3e67'},{x:.45,s:0,p:0,color:'#ffd43e'},{x:.15,s:0,p:0,color:'#a77bff'}],distance=0,curve=0,shake=0,finish=0;
const go=document.getElementById('go');go.onclick=()=>{document.getElementById('start').style.display='none';running=true;started=true;document.getElementById('msg').textContent='3';setTimeout(()=>{if(running)document.getElementById('msg').textContent='2'},800);setTimeout(()=>{if(running)document.getElementById('msg').textContent='1'},1600);setTimeout(()=>{if(running)document.getElementById('msg').textContent='GO!'},2400);setTimeout(()=>{document.getElementById('msg').textContent=''},3200)};
function roadCurve(z){return Math.sin((distance+z*.001)*.00075)*.55+Math.sin((distance+z*.001)*.0016)*.22}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}
function drawCar(x,y,w,h,color,playerCar=false){ctx.save();ctx.translate(x,y);if(playerCar){ctx.shadowColor=color;ctx.shadowBlur=18}polygon([[-w*.5,h*.12],[-w*.42,-h*.45],[-w*.28,-h*.65],[w*.28,-h*.65],[w*.42,-h*.45],[w*.5,h*.12],[w*.42,h*.5],[-w*.42,h*.5]],'#10131b');polygon([[-w*.37,-h*.38],[-w*.25,-h*.57],[w*.25,-h*.57],[w*.37,-h*.38],[w*.3,-h*.14],[-w*.3,-h*.14]],color);polygon([[-w*.3,-h*.12],[w*.3,-h*.12],[w*.34,h*.35],[-w*.34,h*.35]],color);polygon([[-w*.24,-h*.48],[w*.24,-h*.48],[w*.19,-h*.22],[-w*.19,-h*.22]],'#a7e5ff');ctx.fillStyle='#05070a';ctx.fillRect(-w*.52,-h*.3,w*.12,h*.28);ctx.fillRect(w*.4,-h*.3,w*.12,h*.28);ctx.fillRect(-w*.52,h*.2,w*.12,h*.28);ctx.fillRect(w*.4,h*.2,w*.12,h*.28);ctx.fillStyle='#fff';ctx.fillRect(-w*.35,h*.36,w*.16,h*.08);ctx.fillRect(w*.19,h*.36,w*.16,h*.08);ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);let horizon=H*.39;let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#39b5ee');sky.addColorStop(1,'#e7f8ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#fff';for(let i=0;i<5;i++){let cx=(i*230+distance*.02)% (W+180)-90,cy=80+i%2*50;ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse(cx,cy,50,13,0,0,Math.PI*2);ctx.ellipse(cx+30,cy-8,35,15,0,0,Math.PI*2);ctx.ellipse(cx-25,cy-5,28,11,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
ctx.fillStyle='#218c53';ctx.fillRect(0,horizon,W,H-horizon);
let roadTop=H*.13,roadBottom=H*1.12;let centerTop=W*.5+curve*W*.1,centerBottom=W*.5+curve*W*.7-player.x*W*.24,roadWidthTop=W*.08,roadWidthBottom=W*.82;
for(let i=0;i<60;i++){let y1=horizon+(H-horizon)*i/60,y2=horizon+(H-horizon)*(i+1)/60;let t1=i/60,t2=(i+1)/60;let c1=W*.5+curve*W*(t1*t1)-player.x*W*.12*t1,c2=W*.5+curve*W*(t2*t2)-player.x*W*.12*t2;let rw1=W*(.09+.72*t1),rw2=W*(.09+.72*t2);let stripe=(Math.floor((distance/15+i*3)/2)%2);polygon([[c1-rw1*.56,y1],[c1+rw1*.56,y1],[c2+rw2*.56,y2],[c2-rw2*.56,y2]],stripe?'#e9e9e9':'#d83b43');polygon([[c1-rw1*.5,y1],[c1+rw1*.5,y1],[c2+rw2*.5,y2],[c2-rw2*.5,y2]],'#343940');let dash=(Math.floor((distance/18+i)/3)%2);if(dash)polygon([[c1-rw1*.015,y1],[c1+rw1*.015,y1],[c2+rw2*.015,y2],[c2-rw2*.015,y2]],'#f5f4dc')}
for(let i=0;i<18;i++){let z=(i*170-distance*1.4)%(H*1.5);if(z<0)z+=H*1.5;let t=z/(H*1.5),y=horizon+t*(H-horizon),x=(i%2?W*.1:W*.9)+(curve*W*t*.25);let size=10+t*38;ctx.fillStyle='#70422b';ctx.fillRect(x-size*.1,y-size*.4,size*.2,size*.45);ctx.fillStyle='#0c7b45';ctx.beginPath();ctx.ellipse(x,y-size*.6,size*.48,size*.65,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#18a957';ctx.beginPath();ctx.ellipse(x-size*.2,y-size*.75,size*.3,size*.45,0,0,Math.PI*2);ctx.fill()}
let sorted=rivals.slice().sort((a,b)=>b.p-a.p);for(let r of sorted){let rel=(r.p-player.progress);if(rel<-.08||rel>.6)continue;let z=1-Math.max(0,rel)*2;let y=horizon+(H-horizon)*Math.min(.98,z),rw=W*(.09+.72*z),x=W*.5+curve*W*z*z-r.x*rw*.25;drawCar(x,y,rw*.16,rw*.28,r.color)}
drawCar(W*.5-player.x*W*.25,H*.82,W*.14,H*.19,'#22d9ff',true);
}
let last=performance.now();function tick(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(running){let gas=keys.w||keys.arrowup,brake=keys.s||keys.arrowdown,steer=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),boost=keys.shift&&player.nitro>0&&gas;let max=boost?300:235;if(gas)player.speed+=220*dt;else player.speed-=95*dt;if(brake)player.speed-=320*dt;player.speed=Math.max(0,Math.min(max,player.speed));if(boost){player.speed+=95*dt;player.nitro=Math.max(0,player.nitro-30*dt)}else player.nitro=Math.min(100,player.nitro+12*dt);player.x+=steer*dt*(.55+player.speed/170);player.x*=Math.pow(.995,dt*60);if(Math.abs(player.x)>1.15){player.speed*=.985;player.x=Math.max(-1.5,Math.min(1.5,player.x))}distance+=player.speed*dt;player.progress=distance/5000;player.lap=Math.min(3,Math.floor(player.progress)+1);if(player.progress>=3){running=false;finish=1;document.getElementById('msg').textContent='FINISH!';setTimeout(()=>{document.getElementById('start').style.display='flex';document.querySelector('#panel h1').textContent='RACE COMPLETE';go.textContent='RACE AGAIN';document.getElementById('msg').textContent='';distance=0;player={x:0,speed:0,nitro:100,lap:1,progress:0};rivals.forEach(r=>r.p=0)},2500)}
rivals.forEach((r,i)=>{r.s=160+i*9+Math.sin(now*.001+i)*18;r.p+=r.s*dt/5000});curve=roadCurve(0);document.getElementById('speed').innerHTML=Math.round(player.speed*1.15)+' <small>KM/H</small>';document.getElementById('lap').textContent='LAP '+Math.min(3,player.lap)+' / 3';let pos=1+rivals.filter(r=>r.p>player.progress).length;document.getElementById('position').textContent='POSITION '+pos+' / 4';document.getElementById('boost').textContent='NITRO '+('▰'.repeat(Math.ceil(player.nitro/20))+'▱'.repeat(5-Math.ceil(player.nitro/20)))}render();requestAnimationFrame(tick)}requestAnimationFrame(tick);
})();
</script>
</body></html>
